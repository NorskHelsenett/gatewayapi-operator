name: Build and Test

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  packages: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c #v6
        with:
          go-version-file: go.mod
          cache: true
          # This will cache both Go modules and build cache
          cache-dependency-path: go.sum

      # Cache bin folder with tools and binaries
      - name: Cache bin folder
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 #v4
        with:
          path: bin
          key: ${{ runner.os }}-bin-${{ hashFiles('go.mod', 'go.sum', 'Makefile') }}
          restore-keys: |
            ${{ runner.os }}-bin-

      - name: Install dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Lint (go vet)
        run: go vet ./...

      - name: Install setup-envtest
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@3be3f1bf2b2fcc6b5c9510d55c6a9972294653d0 #v0.24.1

      - name: Setup envtest binaries
        id: envtest
        run: |
          # Choose Kubernetes version compatible with your controller-runtime version
          ENVTEST_ASSETS=$(setup-envtest use -p path 1.30.x)
          echo "KUBEBUILDER_ASSETS=$ENVTEST_ASSETS" >> $GITHUB_ENV

      - name: Run tests
        run: |
          go test $(go list ./... | grep -v test) -coverprofile=coverage.out

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    # Run in parallel with build job
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c #v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install dependencies
        run: go mod download

      - name: Run security scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@15aacc21377149f263d1e9587435f22d6af66db1 #v1.4.0
          govulncheck ./...
