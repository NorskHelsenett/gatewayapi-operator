{{- if .Values.networkPolicy.enable }}
# This NetworkPolicy allows ingress traffic to your webhook server running
# as part of the controller-manager from the Kubernetes API server (kube-system).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  name: allow-webhook-traffic
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: gatewayapi-operator
  policyTypes:
    - Ingress
  ingress:
    # Allow webhook calls from the Kubernetes API server namespace (kube-system).
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
      ports:
        - port: 9443
          protocol: TCP
{{- end -}}
