# This NetworkPolicy allows ingress traffic to your webhook server running
# as part of the controller-manager from the Kubernetes API server namespace
# (`kube-system`).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: gatewayapi-operator
    app.kubernetes.io/managed-by: kustomize
  name: allow-webhook-traffic
  namespace: system
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: gatewayapi-operator
  policyTypes:
    - Ingress
  ingress:

    # Allow webhook calls from the Kubernetes API server namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 9443
          protocol: TCP
